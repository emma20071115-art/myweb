<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片晃動與超連結展示畫廊</title>
    <!-- 引入外部獨立的 CSS 檔案 -->
    <link rel="stylesheet" href="U1558031.css">
</head>
<body>

    <div class="container">
        <h1>圖片展示畫廊</h1>
        <p class="subtitle">滑鼠懸停於圖片上可觸發晃動效果，點擊可跳轉至目標網站</p>
        
        <div class="gallery">
            <!-- 圖片卡片 1 -->
            <a href="https://www.google.com" target="_blank" class="img-box">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=1" alt="前往 Google">
                </div>
                <span class="img-title">前往 Google</span>
            </a>

            <!-- 圖片卡片 2 -->
            <a href="https://www.youtube.com" target="_blank" class="img-box">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=2" alt="前往 YouTube">
                </div>
                <span class="img-title">前往 YouTube</span>
            </a>

            <!-- 圖片卡片 3 -->
            <a href="https://zh.wikipedia.org" target="_blank" class="img-box">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=3" alt="前往 維基百科">
                </div>
                <span class="img-title">前往 維基百科</span>
            </a>

            <!-- 圖片卡片 4 -->
            <a href="https://github.com" target="_blank" class="img-box">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=4" alt="前往 GitHub">
                </div>
                <span class="img-title">前往 GitHub</span>
            </a>

            <!-- 圖片卡片 5 -->
            <a href="https://tw.yahoo.com" target="_blank" class="img-box">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/400/300?random=5" alt="前往 Yahoo">
                </div>
                <span class="img-title">前往 Yahoo</span>
            </a>
        </div>
    </div>

</body>
</html>
